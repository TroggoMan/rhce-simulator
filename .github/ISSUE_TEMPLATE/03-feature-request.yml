name: Feature request
description: Suggest a new task, mode, or capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Task-catalog gaps are especially useful — "EX294 domain X has too
        few tasks" or "objective bullet Y has no coverage" is exactly the
        kind of report that improves exam coverage.

  - type: textarea
    id: problem
    attributes:
      label: What's missing, or what problem does this solve?
      description: >-
        E.g. a domain/category with too few tasks, an EX294 objective bullet
        with no coverage, a workflow the simulator makes awkward.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Be as concrete as you can — an example task, a command, a menu option.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where would this fit? (if applicable)
      options:
        - Full Exam (--exam / task panel)
        - Quick Practice (--quick)
        - Practice Mode (--practice CATEGORY)
        - Focus Mode (--focus)
        - Adaptive Mode (--adaptive)
        - Learn Mode (--learn)
        - Lab setup (bootstrap.sh / lab-setup.sh / vm-lab-setup.sh)
        - Not tied to a specific mode

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Optional — anything you tried as a workaround.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to Red Hat's official EX294 objectives, prior discussion, etc.

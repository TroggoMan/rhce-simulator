# Override for pairing the Docker lab's control container with the VM
# lab's managed nodes instead of Docker's own morty/summer/jerry/beth/rick.
#
# The base control service shares docker-compose.yml's bridge network with
# those five containers so it can resolve them by plain hostname — but
# that same bridge cannot route to the VM lab's libvirt/VirtualBox network
# at all (tested: ICMP/TCP both rejected at the host firewall between the
# two virtual networks). network_mode: host sidesteps the routing problem
# entirely by putting the container directly on the host's network
# namespace, at the cost of losing the Docker-lab-native hostname
# resolution this same image relies on there — which is exactly why this
# is a separate override file and not a change to the shared service.
#
# Usage (see scripts/vm-lab-setup.sh):
#   docker compose -f docker-compose.yml -f docker-compose.control-vm.yml \
#       up -d --build --no-deps control
services:
  control:
    network_mode: host

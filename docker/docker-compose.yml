name: rhce-lab

# All nodes create the same login user (RHCE_SIM_REMOTE_USER, default
# "devops") — the exam gives you one consistent user across managed nodes,
# not a different account per host. Hostnames are just lab flavor.
x-node: &node
  build:
    context: .
    dockerfile: Dockerfile
    args:
      user: ${RHCE_SIM_REMOTE_USER:-devops}
  privileged: true
  cgroup: host
  tmpfs:
    - /run
    - /tmp
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw

services:
  morty:
    <<: *node
    hostname: morty
    ports:
      - "2201:22"

  summer:
    <<: *node
    hostname: summer
    ports:
      - "2202:22"

  jerry:
    <<: *node
    hostname: jerry
    ports:
      - "2203:22"

  beth:
    <<: *node
    hostname: beth
    ports:
      - "2204:22"

  rick:
    <<: *node
    hostname: rick
    ports:
      - "2205:22"

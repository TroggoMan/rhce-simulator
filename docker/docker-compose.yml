name: rhce-lab

# Every node comes up with EXAM-STYLE bootstrap access only: root,
# reachable by password (RHCE_LAB_ROOT_PASSWORD, default "rhce-lab"). No
# automation user, no SSH key baked in — building your own inventory,
# ansible.cfg, automation user, key and sudoers from that bootstrap access
# is the candidate's actual first task, exactly like the real exam.
#
# Ports are bound to 127.0.0.1 only, not 0.0.0.0 — root/password SSH has
# no business being reachable from the LAN even on a throwaway lab node.
x-node: &node
  build:
    context: .
    dockerfile: Dockerfile
    args:
      root_password: ${RHCE_LAB_ROOT_PASSWORD:-rhce-lab}
  privileged: true
  cgroup: host
  tmpfs:
    - /run
    - /tmp
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw

# container_name is pinned per service so the containers are addressable as
# plain "kirk"/"spock"/... — scripts/lab-setup.sh and scripts/lab-reset.sh
# docker exec them by node name, and Compose's default <project>-<svc>-<n>
# naming would break both.
services:
  kirk:
    <<: *node
    hostname: kirk
    container_name: kirk
    ports:
      - "127.0.0.1:2201:22"

  spock:
    <<: *node
    hostname: spock
    container_name: spock
    ports:
      - "127.0.0.1:2202:22"

  mccoy:
    <<: *node
    hostname: mccoy
    container_name: mccoy
    ports:
      - "127.0.0.1:2203:22"

  scotty:
    <<: *node
    hostname: scotty
    container_name: scotty
    ports:
      - "127.0.0.1:2204:22"

  # The machine you work FROM — entirely optional, and decoupled from
  # whichever (if any) managed-node lab is running: see
  # scripts/control-setup.sh, which is the only thing that should start
  # this service (lab-setup.sh/vm-lab-setup.sh no longer build it as a
  # side effect). Joins this same network, so managed nodes are reachable
  # as plain hostnames on port 22 — no 127.0.0.1:220x, which makes the
  # inventory you write here look like the one the exam wants.
  # host.docker.internal is mapped so the SAME control node can drive the
  # VM lab too: point RHCE_SIM_NODES at the VM IPs and they route via the
  # host. See docker/Dockerfile.control for why a RHEL-family control node
  # matters at all, and why it git-clones the simulator rather than
  # bind-mounting the host's checkout.
  control:
    build:
      context: .
      dockerfile: Dockerfile.control
      args:
        user_uid: ${RHCE_LAB_UID:-1000}
        user_gid: ${RHCE_LAB_GID:-1000}
        repo_url: ${RHCE_SIM_REPO_URL:-https://github.com/TroggoMan/rhce-simulator.git}
    hostname: control
    container_name: control
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Your working directory only — bind-mounted so you can edit with
      # your own tools on the host and so it survives the container. The
      # simulator itself is a real git clone baked into the image (see
      # Dockerfile.control), not bind-mounted, so this container is a
      # self-contained practice environment rather than a window into the
      # host's checkout.
      - ${RHCE_SIM_WORKDIR:-$HOME/ansible}:/home/student/ansible
      # Your SSH keys outlive a lab-reset. The reset wipes the NODES, so
      # you re-run your bootstrap play afterwards either way — but losing
      # the keypair too, while the bind-mounted inventory referencing it
      # survives, leaves a config pointing at a file that no longer exists.
      - control-ssh:/home/student/.ssh
      # The clone's data/ (results.db, source-control task fixtures) is
      # gitignored and never comes from the image — a named volume here is
      # the only thing that makes practice history survive a rebuild.
      - control-data:/opt/rhce-simulator/data
    working_dir: /home/student/ansible

volumes:
  control-ssh:
  control-data:
